name: Build & Release Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
      MOD_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version=$MOD_VERSION

      - name: Configure Git User
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create and Push Version Tag
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Copy compiled jar to a release asset matching the version name
          cp build/libs/neosora_overrides-*.jar "neosora-overrides-$VERSION.jar"
          cp build/libs/neosora_overrides-*.jar "neosora-overrides.jar"

          gh release create "$VERSION" \
            "neosora-overrides-$VERSION.jar" \
            "neosora-overrides.jar" \
            --title "$VERSION" \
            --notes-file CHANGELOG.md

