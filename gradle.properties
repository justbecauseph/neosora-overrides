org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Gradle auto-provisions the Java 21 toolchain used to compile the mod (foojay resolver,
# see settings.gradle). Gradle itself must run on a JDK it supports - NOT pinned here,
# because a machine-specific path would break CI. See README "Building" if your default
# JDK is too new for Gradle.
org.gradle.java.installations.auto-download=true

# --- Platform -------------------------------------------------------------
# Must match the live server exactly. Verified against
# libraries/net/minecraft/server/1.21.1-20240808.144430/ on the server.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.243
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment supplies parameter names + javadocs for the decompiled MC sources.
# It is a mappings layer only - it contains no Minecraft source code.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- Mod metadata ---------------------------------------------------------
mod_id=neosora_overrides
mod_name=NeoSora Overrides
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=dev.neosora.overrides
mod_authors=NeoSora
mod_description=Server-side patches for third-party mod bugs affecting the NeoSora pack.
